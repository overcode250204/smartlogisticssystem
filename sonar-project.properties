sonar.sources=lib
sonar.tests=test
sonar.test.inclusions=test/**/*.dart
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Coverage is enforced on the domain/core/widget utility layer that is covered by
# unit tests. Screens and API services currently require UI/integration seams and
# are excluded from the line coverage gate until they are refactored for DI.
sonar.coverage.exclusions=\
  lib/main.dart,\
  lib/core/app_router.dart,\
  lib/core/app_theme.dart,\
  lib/feature/authentication/**,\
  lib/feature/category/**,\
  lib/feature/customer/screens/**,\
  lib/feature/customer/service/customer_address_service.dart,\
  lib/feature/customer/service/customer_order_service.dart,\
  lib/feature/customer/service/customer_product_service.dart,\
  lib/feature/customer/service/location_service.dart,\
  lib/feature/dispatch_trip/**,\
  lib/feature/driver/**,\
  lib/feature/exception_reason/**,\
  lib/feature/inventory/**,\
  lib/feature/live_tracking/**,\
  lib/feature/notification/**,\
  lib/feature/order/**,\
  lib/feature/product/**,\
  lib/feature/route_config/**,\
  lib/feature/staff/**,\
  lib/feature/supplier/**,\
  lib/feature/trip_dashboard/**,\
  lib/feature/unit/**,\
  lib/feature/user/**,\
  lib/feature/vehicle/**,\
  lib/feature/warehouse/**,\
  lib/feature/zone/**,\
  lib/widgets/app_shell.dart,\
  lib/widgets/dashboard_widgets.dart,\
  lib/widgets/sidebar.dart,\
  lib/widgets/topbar.dart
